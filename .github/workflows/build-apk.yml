name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Prepare app icon
        run: |
          cat app/icon_data_*.txt | base64 -d > app/src/main/res/drawable/ic_launcher.jpg
      - name: Build debug APK
        run: gradle clean assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sistema-entregas-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
